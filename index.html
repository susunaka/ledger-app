<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3eb575">
<meta name="description" content="简洁、离线可用的个人记账本">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<title>记账本</title>
<style>
:root{
  --green:#3eb575; --green-d:#2f9a61; --green-l:#e8f7ef;
  --red:#e45b4f; --red-l:#fdeceb;
  --bg:#f5f6f8; --card:#ffffff; --line:#eef0f2;
  --t1:#1a1d21; --t2:#5c6470; --t3:#9aa3ad;
  --radius:14px; --shadow:0 2px 12px rgba(20,30,40,.06);
  --app-max:480px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;background:#edf0f3}
html,body{width:100%;min-height:100%;overscroll-behavior-y:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  background:#edf0f3;color:var(--t1);margin:0;overflow-x:hidden;
}
.app-shell{
  width:100%;max-width:var(--app-max);height:100vh;height:100dvh;
  margin:0 auto;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden;
}
.main-content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:8px}
@media (min-width:481px){
  .app-shell{box-shadow:0 0 32px rgba(20,30,40,.07)}
}
button{font:inherit;border:none;background:none;cursor:pointer;color:inherit}
input{font:inherit;border:none;outline:none;background:none;color:inherit}
input,button{touch-action:manipulation}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ===== 顶部 ===== */
.header{
  position:sticky; top:0; z-index:20;
  background:linear-gradient(160deg,#43bf7d,#2f9a61);
  color:#fff; padding:calc(env(safe-area-inset-top) + 14px) 16px 20px;
  border-radius:0 0 28px 28px;
  box-shadow:0 10px 28px rgba(47,154,97,.18);
}
.month-bar{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:14px}
.month-bar .arrow{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;opacity:.9}
.month-bar .arrow:active{background:rgba(255,255,255,.2)}
.month-title{font-size:17px;font-weight:600;letter-spacing:.5px;min-width:110px;text-align:center}
.balance-wrap{text-align:center;margin-bottom:14px}
.balance-label{font-size:12px;opacity:.85;margin-bottom:4px}
.balance-num{font-size:38px;font-weight:700;line-height:1.15}
.balance-num small{font-size:18px;font-weight:600;margin-right:2px}
.io-row{display:flex;justify-content:center;gap:14px}
.io-pill{
  display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);
  border-radius:999px;padding:7px 16px;font-size:13px
}
.io-pill .dot{width:8px;height:8px;border-radius:50%}
.io-pill b{font-weight:600;font-size:14px}
.budget-wrap-out{padding:12px 16px 0;position:relative;z-index:10}
.budget-box{background:#fff;border-radius:16px;padding:12px 14px;font-size:12px;box-shadow:var(--shadow);color:var(--t1)}
.budget-top{display:flex;justify-content:space-between;margin-bottom:8px;color:var(--t2)}
.budget-track{height:7px;border-radius:999px;background:#eef1f4;overflow:hidden}
.budget-fill{height:100%;border-radius:3px;background:#fff;transition:width .4s ease}

/* ===== 页面 ===== */
.page{display:none;padding:12px 14px 0;animation:fade .25s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec-title{font-size:13px;color:var(--t3);margin:6px 4px 10px;font-weight:500}

/* 明细 */
.day-group{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.day-head{display:flex;justify-content:space-between;padding:12px 16px 8px;font-size:13px;color:var(--t2)}
.day-head .dd{font-weight:600;color:var(--t1)}
.tx{display:flex;align-items:center;gap:12px;padding:11px 16px;transition:background .15s}
.tx:active{background:#f6f7f8}
.tx+.tx{border-top:1px solid var(--line)}
.tx-ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tx-ico.exp{background:var(--red-l)}
.tx-ico.inc{background:var(--green-l)}
.tx-mid{flex:1;min-width:0}
.tx-cat{font-size:15px;font-weight:500}
.tx-note{font-size:12px;color:var(--t3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-amt{font-size:16px;font-weight:600;flex-shrink:0}
.tx-amt.exp{color:var(--red)} .tx-amt.inc{color:var(--green-d)}
.empty{padding:70px 0;text-align:center;color:var(--t3)}
.empty .big{font-size:52px;margin-bottom:12px;opacity:.5}
.empty p{font-size:14px;line-height:1.8}

/* 统计 */
.stat-cards{display:flex;gap:10px;margin-bottom:12px}
.stat-card{flex:1;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;text-align:center}
.stat-card .v{font-size:20px;font-weight:700;margin-top:6px}
.stat-card .l{font-size:12px;color:var(--t3)}
.stat-card .v.exp{color:var(--red)} .stat-card .v.inc{color:var(--green-d)}
.chart-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bar-row:last-child{margin-bottom:0}
.bar-ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.bar-info{flex:1;min-width:0}
.bar-line1{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar-line1 b{font-weight:600}
.bar-line1 span{color:var(--t3);font-size:12px}
.bar-track{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .5s ease}

/* 设置 */
.set-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.set-item{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;font-size:15px}
.set-item+.set-item{border-top:1px solid var(--line)}
.set-item .sub{font-size:12px;color:var(--t3);margin-top:2px}
.set-val{color:var(--t3);font-size:14px;display:flex;align-items:center;gap:4px}
.set-val input{width:90px;text-align:right;font-size:15px;color:var(--t1)}
.danger{color:var(--red)}

/* 底部导航：与主界面使用同一宽度和同一居中基准 */
.tabbar{
  position:relative;z-index:30;flex:0 0 auto;
  width:100%;
  min-height:calc(78px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.97);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.tab,.tab-add{
  width:100%;height:64px;display:grid;grid-template-rows:44px 16px;
  align-items:center;justify-items:center;padding:0;font-size:11px;color:var(--t3)
}
.tab .ti{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.tab .ti svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab .tl,.add-label{height:16px;line-height:16px;align-self:start;text-align:center}
.tab.on{color:var(--green-d);font-weight:600}
.tab-add{color:var(--green-d)}
.add-circle{
  position:relative;display:block;width:44px;height:44px;border-radius:50%;align-self:center;
  background:var(--green);box-shadow:0 5px 16px rgba(62,181,117,.28);
  transition:transform .12s
}
.add-circle::before,.add-circle::after{
  content:"";position:absolute;left:50%;top:50%;background:#fff;border-radius:999px;
  transform:translate(-50%,-50%);pointer-events:none
}
.add-circle::before{width:21px;height:2.5px}
.add-circle::after{width:2.5px;height:21px}
.add-label{font-weight:600}
.tab-add:active .add-circle{transform:scale(.92)}

/* 记账弹层 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;bottom:0;left:0;right:0;margin:0 auto;transform:translateY(105%);
  width:100%;max-width:var(--app-max);z-index:50;
  background:#fff;border-radius:20px 20px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));
  transition:transform .28s cubic-bezier(.32,.72,.35,1);max-height:86vh;overflow-y:auto;
}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{flex:1;padding:10px 0;border-radius:9px;font-size:15px;font-weight:500;color:var(--t2);transition:all .18s}
.seg button.on{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);color:var(--t1)}
.seg button.on.exp{color:var(--red)} .seg button.on.inc{color:var(--green-d)}
.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px}
.cat{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 0;border-radius:12px;font-size:12px;color:var(--t2)}
.cat .ci{width:38px;height:38px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:19px;transition:all .18s}
.cat.on{color:var(--t1);font-weight:600}
.cat.on .ci{background:var(--t1);color:#fff;transform:scale(1.08)}
.amt-box{display:flex;align-items:baseline;justify-content:center;gap:4px;padding:6px 0 16px;border-bottom:1px solid var(--line);margin-bottom:14px}
.amt-box .cur{font-size:26px;font-weight:600;color:var(--t2)}
.amt-box input{width:190px;font-size:42px;font-weight:700;text-align:left}
.amt-box input::placeholder{color:#d5d9de}
.f-row{display:flex;gap:10px;margin-bottom:14px}
.f-item{flex:1;background:var(--bg);border-radius:12px;padding:9px 13px}
.f-item label{display:block;font-size:11px;color:var(--t3);margin-bottom:3px}
.f-item input{width:100%;font-size:15px}
.save-btn{
  width:100%;padding:15px 0;border-radius:14px;background:var(--green);color:#fff;
  font-size:17px;font-weight:600;letter-spacing:2px;box-shadow:0 4px 14px rgba(62,181,117,.35);
}
.save-btn:active{transform:scale(.98)}
.save-btn.dis{background:#bfe6d2;box-shadow:none}

/* 确认弹窗 */
.dialog{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:40px}
.dialog.on{display:flex}
.dialog .mask2{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.d-box{position:relative;background:#fff;border-radius:16px;width:100%;max-width:300px;overflow:hidden;animation:pop .2s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.d-body{padding:24px 20px 18px;text-align:center;font-size:15px;line-height:1.6}
.d-btns{display:flex;border-top:1px solid var(--line)}
.d-btns button{flex:1;padding:13px 0;font-size:15px}
.d-btns .ok{color:var(--red);font-weight:600;border-left:1px solid var(--line)}

/* toast */
.toast{
  position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);z-index:70;
  background:rgba(0,0,0,.75);color:#fff;padding:11px 22px;border-radius:999px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap
}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="app-shell">
<div class="main-content" id="mainContent">

<!-- 顶部 -->
<div class="header">
  <div class="month-bar">
    <button class="arrow" id="prevM">&#8249;</button>
    <div class="month-title" id="mTitle"></div>
    <button class="arrow" id="nextM">&#8250;</button>
  </div>
  <div class="balance-wrap">
    <div class="balance-label">本月结余</div>
    <div class="balance-num num"><small>&#165;</small><span id="balNum">0.00</span></div>
  </div>
  <div class="io-row">
    <div class="io-pill"><span class="dot" style="background:#ffd166"></span>&#25910;&#20837; <b class="num" id="incNum">0.00</b></div>
    <div class="io-pill"><span class="dot" style="background:#fff"></span>&#25903;&#20986; <b class="num" id="expNum">0.00</b></div>
  </div>
</div>
<div class="budget-wrap-out">
  <div class="budget-box">
    <div class="budget-top"><span id="budLabel">&#26412;&#26376;&#39044;&#31639;</span><span class="num" id="budText"></span></div>
    <div class="budget-track"><div class="budget-fill" id="budFill" style="width:0%"></div></div>
  </div>
</div>

<!-- 明细页 -->
<div class="page on" id="pgList"><div id="txList"></div></div>

<!-- 统计页 -->
<div class="page" id="pgStat">
  <div class="stat-cards">
    <div class="stat-card"><div class="l">&#24635;&#25903;&#20986;</div><div class="v exp num" id="stExp">&#165;0</div></div>
    <div class="stat-card"><div class="l">&#24635;&#25910;&#20837;</div><div class="v inc num" id="stInc">&#165;0</div></div>
  </div>
  <div class="chart-card" id="expChart"></div>
</div>

<!-- 设置页 -->
<div class="page" id="pgSet">
  <div class="set-card">
    <div class="set-item">
      <div>&#26376;&#24230;&#39044;&#31639;<div class="sub">&#35774;&#32622;&#21518;&#39318;&#39029;&#26174;&#31034;&#33457;&#36153;&#36827;&#24230;</div></div>
      <div class="set-val num">&#165; <input type="number" inputmode="decimal" id="budInput" placeholder="0"></div>
    </div>
    <div class="set-item" id="exportBtn">
      <div>&#23548;&#20986;&#25968;&#25454;<div class="sub">&#29983;&#25104; JSON &#22791;&#20221;&#65292;&#21487;&#20445;&#23384;&#21040;&#8220;&#25991;&#20214;&#8221;</div></div>
      <div class="set-val">&#8250;</div>
    </div>
    <div class="set-item" id="importBtn">
      <div>&#23548;&#20837;&#25968;&#25454;<div class="sub">&#20174; JSON &#22791;&#20221;&#24674;&#22797;&#35760;&#36134;&#35760;&#24405;</div></div>
      <div class="set-val">&#8250;</div>
      <input type="file" id="importInput" accept="application/json,.json" hidden>
    </div>
    <div class="set-item" id="clearBtn">
      <div class="danger">&#28165;&#31354;&#25152;&#26377;&#25968;&#25454;<div class="sub">&#21024;&#38500;&#21518;&#26080;&#27861;&#24674;&#22797;</div></div>
      <div class="set-val">&#8250;</div>
    </div>
  </div>
  <div class="set-card" id="installHelp">
    <div class="set-item"><div>&#23433;&#35013;&#21040; iPhone<div class="sub">Safari &#28857;&#20987;&#8220;&#20998;&#20139;&#8221; &#8594; &#8220;&#28155;&#21152;&#21040;&#20027;&#23631;&#24149;&#8221; &#8594; &#25171;&#24320;&#20026; Web App</div></div><div class="set-val">&#11014;&#65039;</div></div>
  </div>
  <div class="set-card">
    <div class="set-item"><div>&#29256;&#26412;</div><div class="set-val">v1.5</div></div>
    <div class="set-item"><div>&#25968;&#25454;&#23384;&#20648;</div><div class="set-val">&#26412;&#26426;&#31163;&#32447;&#23384;&#20648;</div></div>
  </div>
</div>

</div>
<div class="tabbar">
  <button class="tab-add" id="addBtn" aria-label="记一笔"><span class="add-circle" aria-hidden="true"></span><span class="add-label">记账</span></button>
  <button class="tab on" data-pg="pgList"><span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h11"/><path d="M8 12h11"/><path d="M8 18h11"/><path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/></svg></span><span class="tl">&#26126;&#32454;</span></button>
  <button class="tab" data-pg="pgStat"><span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><path d="M7 16V10"/><path d="M12 16V6"/><path d="M17 16v-3"/></svg></span><span class="tl">&#32479;&#35745;</span></button>
  <button class="tab" data-pg="pgSet"><span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 .6 1.65 1.65 0 0 0-.33 1V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82-.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-.6-1 1.65 1.65 0 0 0-1-.33H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-.6 1.65 1.65 0 0 0 .33-1V3a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.24.3.44.65.6 1 .16.35.25.72.25 1.09 0 .37-.09.74-.25 1.09-.16.35-.36.7-.6 1Z"/></svg></span><span class="tl">&#35774;&#32622;</span></button>
</div>
</div><!-- /.app-shell -->

<!-- 记账弹层 -->
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="seg">
    <button id="segExp" class="on exp">&#25903;&#20986;</button>
    <button id="segInc">&#25910;&#20837;</button>
  </div>
  <div class="cat-grid" id="catGrid"></div>
  <div class="amt-box">
    <span class="cur">&#165;</span>
    <input type="number" inputmode="decimal" id="amtInput" placeholder="0.00" min="0" step="0.01">
  </div>
  <div class="f-row">
    <div class="f-item">
      <label>&#22791;&#27880;</label>
      <input type="text" id="noteInput" placeholder="&#36873;&#22635;&#65292;&#22914;&#65306;&#21320;&#39184;" maxlength="20">
    </div>
    <div class="f-item" style="flex:0 0 150px">
      <label>&#26085;&#26399;</label>
      <input type="date" id="dateInput">
    </div>
  </div>
  <button class="save-btn" id="saveBtn">&#20445; &#23384;</button>
</div>

<!-- 确认弹窗 -->
<div class="dialog" id="dialog">
  <div class="mask2" id="dlgMask"></div>
  <div class="d-box">
    <div class="d-body" id="dlgText"></div>
    <div class="d-btns">
      <button id="dlgCancel">&#21462;&#28040;</button>
      <button class="ok" id="dlgOk">&#30830;&#23450;</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
var EXP_CATS=[['餐饮','🍜'],['交通','🚇'],['购物','🛍️'],['居住','🏠'],['娱乐','🎮'],['医疗','💊'],['教育','📚'],['其他','📦']];
var INC_CATS=[['工资','💼'],['兼职','💻'],['投资','📈'],['红包','🧧'],['其他','📦']];
var LS_KEY='ledger_v1';

function load(){ try{ return JSON.parse(localStorage.getItem(LS_KEY))||{recs:[],budget:0}; }catch(e){ return {recs:[],budget:0}; } }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){} }
var data=load();

var now=new Date();
var cur={y:now.getFullYear(), m:now.getMonth()+1};
var fType='expense', fCat='餐饮', delId=null;

var $=function(id){ return document.getElementById(id); };
function fmt(n){ return (n<0?'-':'')+'¥'+Math.abs(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmt0(n){ return '¥'+n.toLocaleString('zh-CN',{maximumFractionDigits:0}); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function pad(n){ return (n<10?'0':'')+n; }
function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.add('on');
  setTimeout(function(){ t.classList.remove('on'); },1500);
}

/* ---------- 数据计算 ---------- */
function monthRecs(){
  return data.recs.filter(function(r){
    var d=r.date.split('-');
    return +d[0]===cur.y && +d[1]===cur.m;
  }).sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:b.id-a.id; });
}

/* ---------- 渲染：顶部 ---------- */
function renderHead(){
  $('mTitle').textContent=cur.y+'年'+cur.m+'月';
  var list=monthRecs(), inc=0, exp=0;
  list.forEach(function(r){ r.type==='expense'?exp+=r.amount:inc+=r.amount; });
  $('balNum').textContent=(inc-exp).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
  $('incNum').textContent=inc.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
  $('expNum').textContent=exp.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
  var bud=data.budget;
  if(bud>0){
    var pct=Math.min(exp/bud*100,100);
    $('budFill').style.width=pct+'%';
    $('budFill').style.background = pct>=100 ? '#ff6b5e' : (pct>=80 ? '#ffd166' : '#fff');
    $('budText').textContent='已花 '+fmt0(exp)+' / '+fmt0(bud)+(pct>=100?'，超支了！':'');
  }else{
    $('budFill').style.width='0%';
    $('budText').textContent='未设置，去“设置”页添加';
  }
}

/* ---------- 渲染：明细 ---------- */
function icoOf(cat){
  var all=EXP_CATS.concat(INC_CATS);
  for(var i=0;i<all.length;i++) if(all[i][0]===cat) return all[i][1];
  return '📦';
}
function renderList(){
  var list=monthRecs(), box=$('txList');
  if(!list.length){
    box.innerHTML='<div class="empty"><div class="big">🤷</div><p>本月还没有记录<br>点左下角“+”记一笔吧</p></div>';
    return;
  }
  var groups={}, order=[];
  list.forEach(function(r){
    if(!groups[r.date]){ groups[r.date]=[]; order.push(r.date); }
    groups[r.date].push(r);
  });
  var html='';
  order.forEach(function(d){
    var ds=d.split('-'), dt=new Date(+ds[0],+ds[1]-1,+ds[2]);
    var wd=['日','一','二','三','四','五','六'][dt.getDay()];
    var sum=0;
    groups[d].forEach(function(r){ sum += r.type==='expense'?-r.amount:r.amount; });
    html+='<div class="day-group"><div class="day-head"><span class="dd">'+(+ds[1])+'月'+(+ds[2])+'日 星期'+wd+'</span><span class="num">'+(sum<0?'-':'+')+fmt0(Math.abs(sum))+'</span></div>';
    groups[d].forEach(function(r){
      var ex=r.type==='expense';
      html+='<div class="tx" data-id="'+r.id+'">'
        +'<div class="tx-ico '+(ex?'exp':'inc')+'">'+icoOf(r.cat)+'</div>'
        +'<div class="tx-mid"><div class="tx-cat">'+esc(r.cat)+'</div>'
        +(r.note?'<div class="tx-note">'+esc(r.note)+'</div>':'')
        +'</div><div class="tx-amt num '+(ex?'exp':'inc')+'">'+(ex?'-':'+')+fmt(r.amount)+'</div></div>';
    });
    html+='</div>';
  });
  box.innerHTML=html;
}

/* ---------- 渲染：统计 ---------- */
var BAR_COLORS=['#3eb575','#5ec98d','#f0a35e','#e45b4f','#5aa7e8','#9a8cf0','#e97ba8','#9aa3ad'];
function renderStat(){
  var list=monthRecs(), inc=0, byCat={};
  list.forEach(function(r){
    if(r.type==='expense'){ byCat[r.cat]=(byCat[r.cat]||0)+r.amount; }
    else inc+=r.amount;
  });
  var exp=0; Object.keys(byCat).forEach(function(k){ exp+=byCat[k]; });
  $('stExp').textContent=fmt0(exp);
  $('stInc').textContent=fmt0(inc);
  var arr=Object.keys(byCat).map(function(k){ return [k,byCat[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
  if(!arr.length){
    $('expChart').innerHTML='<div class="empty" style="padding:36px 0"><p>本月暂无支出数据</p></div>';
    return;
  }
  var max=arr[0][1];
  var html='<div class="sec-title">支出分类占比</div>';
  arr.forEach(function(item,i){
    var pct=max?item[1]/max*100:0, share=exp?item[1]/exp*100:0;
    html+='<div class="bar-row"><div class="bar-ico" style="background:'+BAR_COLORS[i%BAR_COLORS.length]+'22">'+icoOf(item[0])+'</div>'
      +'<div class="bar-info"><div class="bar-line1"><b>'+esc(item[0])+'</b><span class="num">'+fmt0(item[1])+' · '+share.toFixed(1)+'%</span></div>'
      +'<div class="bar-track"><div class="bar-fill" style="width:'+Math.max(pct,3)+'%;background:'+BAR_COLORS[i%BAR_COLORS.length]+'"></div></div></div></div>';
  });
  $('expChart').innerHTML=html;
}

function renderAll(){ renderHead(); renderList(); renderStat(); }

/* ---------- 表单 ---------- */
function renderCats(){
  var cats = fType==='expense'?EXP_CATS:INC_CATS;
  if(!cats.some(function(c){return c[0]===fCat;})) fCat=cats[0][0];
  $('catGrid').innerHTML=cats.map(function(c){
    return '<button class="cat'+(c[0]===fCat?' on':'')+'" data-cat="'+c[0]+'"><span class="ci">'+c[1]+'</span>'+c[0]+'</button>';
  }).join('');
}
function openSheet(){
  var d=new Date();
  var lastDay=new Date(cur.y,cur.m,0).getDate();
  $('dateInput').value=cur.y+'-'+pad(cur.m)+'-'+pad(Math.min(d.getDate(),lastDay));
  $('amtInput').value=''; $('noteInput').value='';
  $('saveBtn').classList.add('dis');
  renderCats();
  $('mask').classList.add('on'); $('sheet').classList.add('on');
}
function closeSheet(){ $('mask').classList.remove('on'); $('sheet').classList.remove('on'); }

/* ---------- 事件 ---------- */
$('prevM').onclick=function(){ cur.m===1?(cur.m=12,cur.y--):cur.m--; renderAll(); };
$('nextM').onclick=function(){ cur.m===12?(cur.m=1,cur.y++):cur.m++; renderAll(); };

document.querySelectorAll('.tab[data-pg]').forEach(function(t){
  t.onclick=function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
    t.classList.add('on');
    document.querySelectorAll('.page').forEach(function(p){p.classList.remove('on');});
    $(t.dataset.pg).classList.add('on');
    if(t.dataset.pg==='pgSet') $('budInput').value=data.budget||'';
    $('mainContent').scrollTo({top:0,behavior:'instant' in window ? 'instant' : 'auto'});
  };
});

$('addBtn').onclick=openSheet;
$('mask').onclick=closeSheet;

$('segExp').onclick=function(){ fType='expense'; fCat=EXP_CATS[0][0];
  $('segExp').className='on exp'; $('segInc').className=''; renderCats(); };
$('segInc').onclick=function(){ fType='income'; fCat=INC_CATS[0][0];
  $('segInc').className='on inc'; $('segExp').className=''; renderCats(); };
$('catGrid').onclick=function(e){
  var b=e.target.closest('.cat'); if(!b) return;
  fCat=b.dataset.cat; renderCats();
};

$('amtInput').addEventListener('input',function(){
  $('saveBtn').classList.toggle('dis', !(parseFloat(this.value)>0));
});

$('saveBtn').onclick=function(){
  var amt=parseFloat($('amtInput').value);
  if(!(amt>0)){ toast('请输入正确金额'); return; }
  var dt=$('dateInput').value;
  if(!dt){ toast('请选择日期'); return; }
  data.recs.push({
    id: Date.now(),
    type: fType, cat: fCat,
    note: $('noteInput').value.trim(),
    amount: Math.round(amt*100)/100,
    date: dt
  });
  save();
  var ds=dt.split('-'); cur={y:+ds[0], m:+ds[1]};
  closeSheet(); renderAll();
  toast('记账成功 🎉');
  document.querySelector('.tab[data-pg="pgList"]').click();
};

/* 删除：点击记录 */
$('txList').onclick=function(e){
  var row=e.target.closest('.tx'); if(!row) return;
  delId=+row.dataset.id;
  var r=null;
  data.recs.forEach(function(x){ if(x.id===delId) r=x; });
  if(!r) return;
  $('dlgText').innerHTML='删除这笔'+(r.type==='expense'?'支出':'收入')+'？<br><b class="num">'+esc(r.cat)+' '+(r.type==='expense'?'-':'+')+fmt(r.amount)+'</b>';
  $('dialog').classList.add('on');
};
$('dlgCancel').onclick=function(){ $('dialog').classList.remove('on'); delId=null; };
$('dlgMask').onclick=function(){ $('dialog').classList.remove('on'); delId=null; };
$('dlgOk').onclick=function(){
  if(delId==='clear'){
    data={recs:[],budget:data.budget}; save(); renderAll(); toast('已清空');
  }else if(delId!=null){
    data.recs=data.recs.filter(function(x){return x.id!==delId;}); save(); renderAll(); toast('已删除');
  }
  $('dialog').classList.remove('on'); delId=null;
};

/* 设置 */
$('budInput').addEventListener('change',function(){
  var v=parseFloat(this.value);
  data.budget = v>0? Math.round(v*100)/100 : 0;
  save(); renderHead(); toast(data.budget>0?'预算已保存':'已取消预算');
});
$('exportBtn').onclick=async function(){
  var filename='ledger_'+cur.y+pad(cur.m)+'.json';
  var content=JSON.stringify(data,null,2);

  // Native iOS wrapper: hand the backup to Swift and open the system share sheet.
  if(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ledgerApp){
    window.webkit.messageHandlers.ledgerApp.postMessage({action:'export',filename:filename,content:content});
    toast('已打开系统分享');
    return;
  }

  // Installed web app / Safari: prefer the iOS share sheet so the file can be saved to Files/iCloud.
  try{
    var file=new File([content],filename,{type:'application/json'});
    if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
      await navigator.share({title:'记账本数据备份',text:'记账本 JSON 数据备份',files:[file]});
      toast('备份已分享');
      return;
    }
  }catch(e){
    if(e && e.name==='AbortError') return;
  }

  // Desktop and older browsers fallback.
  var blob=new Blob([content],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
  toast('备份已导出');
};

$('importBtn').onclick=function(){ $('importInput').click(); };
$('importInput').onchange=function(){
  var file=this.files && this.files[0];
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var obj=JSON.parse(String(reader.result||''));
      if(!obj || !Array.isArray(obj.recs)) throw new Error('bad format');
      var clean=[];
      obj.recs.forEach(function(r){
        if(!r || (r.type!=='expense' && r.type!=='income')) return;
        var amount=Number(r.amount);
        var date=String(r.date||'');
        if(!(amount>0) || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
        clean.push({
          id:Number(r.id)||Date.now()+clean.length,
          type:r.type,
          cat:String(r.cat||'其他').slice(0,20),
          note:String(r.note||'').slice(0,100),
          amount:Math.round(amount*100)/100,
          date:date
        });
      });
      data={recs:clean,budget:Number(obj.budget)>0?Math.round(Number(obj.budget)*100)/100:0};
      save(); renderAll();
      $('budInput').value=data.budget||'';
      toast('已恢复 '+clean.length+' 条记录');
    }catch(e){
      toast('备份文件格式不正确');
    }
    $('importInput').value='';
  };
  reader.onerror=function(){ toast('读取备份失败'); $('importInput').value=''; };
  reader.readAsText(file,'utf-8');
};
$('clearBtn').onclick=function(){
  $('dlgText').textContent='确定要清空所有记录吗？此操作无法撤销。';
  delId='clear';
  $('dialog').classList.add('on');
};

renderAll();

var standalone=(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
  || window.navigator.standalone===true
  || !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ledgerApp);
if(standalone && $('installHelp')) $('installHelp').style.display='none';

if(('serviceWorker' in navigator) && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./service-worker.js').then(function(reg){ reg.update(); }).catch(function(){});
  });
}
})();
</script>
</body>
